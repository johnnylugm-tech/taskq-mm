[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskq-api"
version = "1.0.0"
description = "HTTP task-queue service (round-2 test bed for harness-methodology)."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
